<!doctype html><html><head><meta charset="UTF-8"><title>LeetCode reader checks</title></head><body><p>Running browser checks…</p><script type="module">
import { buildReaderDocument, statementBlocks } from '/src/leetcode-reader.ts'
import { LEETCODE_CACHE_KEY, normalizeDailyProblem, fetchDailyProblem } from '/src/leetcode-data.ts'
import { loadProblemImage } from '/src/leetcode-images.ts'
import { getTextWidth } from '/node_modules/@evenrealities/pretext/dist/font_measure.js'
const assert = (condition, message) => { if (!condition) throw new Error(message) }
try {
  const fixture = normalizeDailyProblem({date:'2026-10-19',questionFrontendId:'94',title:'Binary Tree Inorder Traversal',titleSlug:'binary-tree-inorder-traversal',difficulty:'Easy',stats:JSON.stringify({totalAcceptedRaw:300000,totalSubmissionRaw:400000,acRate:'75.0%'}),content:`
    <p>Given a tree, return the values &lt;= 10<sup>5</sup>, a<sub>i</sub> and 2<sup>n + 1</sup>.</p>
    <p><strong>Example 1:</strong></p><pre>Input: [1,null,2,3]\nOutput: [1,3,2]\nExplanation: Traverse in order.</pre>
    <p><img src="https://assets.leetcode.com/uploads/2024/08/29/screenshot-2024-08-29-202743.png" alt="Tree example" /></p>
    <p>After the image, keep this exact sentence.</p><table><tr><th>Name</th><th>Value</th></tr><tr><td>x</td><td>2</td></tr></table>
    <p>Constraints:</p><ul><li>-100 &lt;= Node.val &lt;= 100</li></ul><script>window.__unsafe = true;<\/script>`})
  const doc = buildReaderDocument(fixture, getTextWidth)
  const text = doc.lines.join('\n')
  assert(text.includes('10^5') && text.includes('a_i') && text.includes('2^(n + 1)'), 'powers and subscripts')
  assert(text.includes('Input: [1,null,2,3]') && text.includes('Output: [1,3,2]'), 'examples')
  assert(text.startsWith('Given a tree,') && !text.includes('LeetCode daily'), 'no duplicate title or date in body')
  assert(text.includes('Example 1:\nInput:'), 'example spacing')
  assert(text.includes('Constraints:\n- -100 <= Node.val <= 100'), 'constraints spacing')
  assert(text.endsWith('Acceptance rate: 75.0%') && text.includes('Accepted submissions: 300,000'), 'statistics at end')
  assert(text.includes('Name | Value') && text.includes('-100 <= Node.val <= 100'), 'tables and constraints')
  assert(!text.includes('window.__unsafe') && !window.__unsafe, 'inert statement HTML')
  assert(doc.images.length === 1 && doc.images[0].rows === 1, 'compact image reference')
  assert(doc.lines.indexOf('After the image, keep this exact sentence.') > doc.images[0].start, 'content order')
  assert(statementBlocks('<p>A</p><img src="javascript:alert(1)"><p>B</p>')[1].url === null, 'unsafe image rejected')
  const huge = buildReaderDocument({...fixture,html:'<p>'+('text 中文 10<sup>9</sup> ').repeat(8000)+'</p>'},getTextWidth)
  assert(huge.lines.length > 1000, 'long document remains complete')
  assert(huge.lines.every(line=>getTextWidth(line)<=500 && new TextEncoder().encode(line).length<=128),'native line limits')
  const image = await loadProblemImage(doc.images[0].url, '/__hud_api')
  assert(image.width <= 500 && image.height <= 189 && image.pixels.some(p=>p>0), 'real diagram rasterization')
  const daily = await fetchDailyProblem('/__hud_api')
  assert(daily.number && daily.html.includes('Example'), 'live international daily statement')
  const installed = await fetchDailyProblem('')
  assert(installed.number && installed.html.includes('Example'), 'installed WebView CORS data access without a relay or API key')
  assert(daily.difficulty && daily.accepted !== null && installed.accepted !== null, 'official and installed metadata counts')
  console.log('LEETCODE_BROWSER_CHECKS_PASSED', { number:daily.number,date:daily.date,lines:doc.lines.length,longLines:huge.lines.length,image:[image.width,image.height] })
  // Open the actual app with its trusted local UI after the isolated parser checks.
  const app = new DOMParser().parseFromString(await (await fetch('/')).text(),'text/html')
  document.body.replaceChildren(...Array.from(app.body.childNodes))
  const saved = localStorage.getItem(LEETCODE_CACHE_KEY)
  if (new URL(location.href).searchParams.has('fixture')) localStorage.setItem(LEETCODE_CACHE_KEY,JSON.stringify({...fixture,date:new Date().toISOString().slice(0,10),fetchedAt:Date.now()}))
  await import('/src/main.ts')
  if (new URL(location.href).searchParams.has('fixture')) { if(saved) localStorage.setItem(LEETCODE_CACHE_KEY,saved); else localStorage.removeItem(LEETCODE_CACHE_KEY) }
} catch(error) { console.error('LEETCODE_BROWSER_CHECKS_FAILED',error.stack || error.message); document.body.textContent=error.message }
</script></body></html>
